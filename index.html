<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلس تعاملی رادیولوژی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0e2038;
  --bg-2:#123057;
  --panel:#15335c;
  --panel-2:#1a3d6e;
  --line:#2c4f86;
  --text:#eef4fc;
  --muted:#9fb2d4;
  --gold:#ffcf4d;
  --gold-2:#ffe08a;
  --gold-dim:#ffcf4d22;
  --patho:#ff8066;
  --normal:#49e0b3;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Vazirmatn',system-ui,sans-serif;
  min-height:100vh;
}
::selection{background:var(--gold-dim);}
.mono{font-family:'IBM Plex Mono',monospace;}
img{max-width:100%;}

body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 45% at 15% -8%, #1e4a8a55, transparent),
    radial-gradient(ellipse 55% 40% at 105% 100%, #ffcf4d14, transparent);
  pointer-events:none;
  z-index:0;
}

.hidden{display:none !important;}

.btn{
  font-family:'Vazirmatn',sans-serif;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.15s;
}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.primary{background:var(--gold);color:#1b1400;border-color:var(--gold);font-weight:700;}
.btn.primary:hover{filter:brightness(1.06);color:#1b1400;}
.btn.ghost{background:transparent;}
.btn.danger:hover{border-color:var(--patho);color:var(--patho);}
.btn.small{padding:6px 10px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.link-btn{
  background:none;border:none;color:var(--muted);font-family:'Vazirmatn',sans-serif;
  font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.link-btn:hover{color:var(--gold);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;
  box-shadow:0 10px 30px -10px #000a;
}

/* ================= STUDENT SCREEN ================= */
#studentScreen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

.s-header{
  display:flex;align-items:center;gap:16px;padding:18px 28px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
  background:linear-gradient(180deg,#0f2440,#0e2038);
}
.s-brand{display:flex;align-items:center;gap:10px;}
.s-brand img{width:38px;height:38px;object-fit:contain;}
.s-brand .names{display:flex;flex-direction:column;line-height:1.35;}
.s-brand .fa{font-size:13.5px;font-weight:700;}
.s-brand .en{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
.s-search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;
}
.s-search input{
  flex:1;background:none;border:none;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:13.5px;
}
.s-search input:focus{outline:none;}
.s-admin-entry{font-size:11.5px;color:var(--muted);}

.s-chips{
  display:flex;gap:8px;padding:14px 28px;flex-wrap:wrap;border-bottom:1px solid var(--line);
}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:6px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.active{background:var(--gold);color:#1b1400;border-color:var(--gold);font-weight:700;}

.s-body{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0;}
@media (max-width:900px){.s-body{grid-template-columns:1fr;}}

.s-list{border-inline-start:1px solid var(--line);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.s-card{
  border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;
}
.s-card:hover{border-color:var(--gold);}
.s-card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.s-card .thumb{width:100%;aspect-ratio:16/10;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;}
.s-card .thumb.empty{background:var(--panel-2);}
.s-card .meta{padding:10px 12px;}
.s-card .meta .cat{font-size:10px;color:var(--gold);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
.s-card .meta .ttl{font-size:14px;font-weight:700;margin-top:3px;}

.s-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:40px;text-align:center;}

.s-detail{padding:24px 30px 60px;overflow-y:auto;}
.s-detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.s-detail-title h2{margin:0;font-size:24px;font-weight:800;}
.s-detail-title .sub{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:4px;}
.s-detail-title .cat-badge{
  display:inline-block;margin-top:8px;background:var(--gold-dim);color:var(--gold);
  font-size:11px;padding:3px 10px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.diff-badge{
  display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  background:var(--d-bg,var(--gold-dim));color:var(--d-color,var(--gold));
}
.case-num{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.s-detail-actions{display:flex;gap:8px;flex-wrap:wrap;}

.sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
@media (max-width:640px){.sections-grid{grid-template-columns:1fr;}}
.sec-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.sec-card .sec-label{font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.sec-card .sec-body{font-size:13.5px;line-height:1.9;color:var(--text);}
.sec-card .sec-body.empty{color:var(--muted);font-style:normal;}



.img-stage{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;
}
.stage-row{display:grid;grid-template-columns:1fr 1fr;}
.stage-row.single{grid-template-columns:1fr;}
@media (max-width:760px){.stage-row{grid-template-columns:1fr;}}
.img-panel{display:flex;flex-direction:column;min-width:0;}
.img-panel + .img-panel{border-inline-start:1px solid var(--line);}
@media (max-width:760px){.img-panel + .img-panel{border-inline-start:none;border-top:1px solid var(--line);}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);}
.panel-label{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;}
.panel-label .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;}
.panel-label.is-normal .dot{background:var(--normal);}
.fs-btn{font-size:13px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s;}
.fs-btn:hover{border-color:var(--gold);color:var(--text,#eee);}
.img-canvas{padding:16px;display:flex;align-items:center;justify-content:center;background:#000;flex:1;}
.img-wrap{position:relative;max-width:100%;line-height:0;}
.img-wrap img{display:block;max-width:100%;max-height:58vh;width:100%;object-fit:contain;}
.img-wrap.empty{
  width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;background:var(--panel-2);border-radius:8px;
}
.img-hint{padding:10px 14px;font-size:12px;color:var(--muted);text-align:center;background:var(--panel-2);border-top:1px solid var(--line);}
.marker{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.marker .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--m-color, var(--gold));animation:pulse 2.4s ease-out infinite;}
@media (prefers-reduced-motion:reduce){.marker .ring{animation:none;}}
.marker .core{width:10px;height:10px;border-radius:50%;background:var(--m-color, var(--gold));box-shadow:0 0 10px var(--m-color, var(--gold));position:relative;z-index:2;}
.marker.active .core{background:var(--gold-2);box-shadow:0 0 14px var(--gold-2);}
.marker.active .ring{border-color:var(--gold-2);}
@keyframes pulse{0%{transform:scale(.6);opacity:.9;}70%{transform:scale(1.9);opacity:0;}100%{opacity:0;}}

.fs-overlay{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;}
.fs-overlay .fs-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#0e0e12;border-bottom:1px solid var(--line);}
.fs-overlay .fs-close{font-size:13px;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--text,#eee);cursor:pointer;}
.fs-overlay .img-canvas{flex:1;padding:24px;}
.fs-overlay .img-wrap img{max-height:88vh;}

.dock-desc{margin:0;padding:16px 18px;background:var(--m-bg, var(--panel-2));border-top:1px solid var(--line);border-inline-start:4px solid var(--m-color, var(--gold-2));animation:ddIn .15s ease-out;}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;}}
.dock-desc .dd-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.dock-desc .dd-title{font-size:15px;font-weight:700;color:var(--m-color, var(--gold-2));flex:1;}
.dock-desc .dd-type{font-size:11px;padding:2px 10px;border-radius:20px;background:var(--panel);color:var(--m-color);}
.dock-desc .dd-close{cursor:pointer;color:var(--muted);font-size:16px;line-height:1;background:none;border:none;padding:2px 4px;}
.dock-desc .dd-close:hover{color:var(--text,#eee);}
.dock-desc .dd-desc{font-size:14px;line-height:1.8;color:var(--text,#eee);}
@media (max-width:760px){.dock-desc{padding:13px 15px;} .dock-desc .dd-title{font-size:13.5px;} .dock-desc .dd-desc{font-size:13px;}}

.findings-panel{border-inline-start:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg-2);overflow-y:auto;max-height:60vh;}
.findings-panel h4{margin:0;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
.finding-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.15s;}
.finding-card:hover{border-color:var(--gold);}
.finding-card.active{border-color:var(--gold-2);background:var(--panel-2);}
.finding-card .fc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.finding-card .num{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--m-bg,var(--gold-dim));color:var(--m-color,var(--gold));}
.finding-card .ftitle{font-weight:700;font-size:13.5px;flex:1;}
.finding-card .fdesc{font-size:12px;color:var(--muted);line-height:1.7;}
.finding-card .fdesc.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.finding-card .type-tag{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--m-color);}

.other-findings{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;}
.other-findings .of-title{font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.other-findings .of-note{font-size:11px;color:var(--muted);margin-bottom:10px;}
.of-list{display:flex;flex-wrap:wrap;gap:8px;}
.of-chip{font-size:12.5px;padding:6px 13px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line);color:var(--text);}

.source-line{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;}
.source-line b{color:var(--text);}

/* ================= ADMIN SCREEN ================= */
#adminScreen{position:relative;z-index:1;min-height:100vh;}
.a-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg-2);
}
.a-topbar .a-title{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);}
.a-topbar .a-title b{color:var(--text);}

.a-body{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 57px);}
@media (max-width:820px){.a-body{grid-template-columns:1fr;}}
.a-sidebar{border-inline-start:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
.case-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;}
.case-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;color:var(--muted);transition:.15s;font-size:14px;}
.case-item:hover{background:var(--panel);color:var(--text);}
.case-item.active{background:var(--panel-2);border-color:var(--line);color:var(--text);}
.case-item .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.case-item.active .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.case-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.case-item .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}

.a-main{padding:0;}
.stage-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.stage-title h2{margin:0;font-size:19px;font-weight:700;}
.stage-title .sub{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.mode-toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
.mode-toggle button{border:none;background:transparent;color:var(--muted);font-family:'Vazirmatn',sans-serif;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s;}
.mode-toggle button.active{background:var(--gold);color:#1b1400;font-weight:700;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:60px 40px;}
.empty-state .glyph{font-size:34px;opacity:.5;}

.workspace{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:0;}
@media (max-width:900px){.workspace{grid-template-columns:1fr;}}
.canvas-area{padding:26px;display:flex;align-items:flex-start;justify-content:center;overflow:auto;}
.a-img-wrap{position:relative;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 0 0 1px #000, 0 30px 60px -20px #000a;line-height:0;cursor:default;}
.a-img-wrap.placing{cursor:crosshair;}
.a-img-wrap img{display:block;max-width:100%;max-height:65vh;user-select:none;-webkit-user-drag:none;}
.a-img-wrap.empty-img{width:640px;max-width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px;}

.hint-banner{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.hint-banner .k{color:var(--gold);font-family:'IBM Plex Mono',monospace;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
.modal{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px #000c;margin:auto;max-height:88vh;overflow-y:auto;}
.modal h3{margin:0;font-size:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;color:var(--muted);}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:14px;resize:vertical;}
.field textarea{min-height:70px;line-height:1.8;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-select{display:flex;gap:10px;}
.type-opt{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center;cursor:pointer;font-size:13px;color:var(--muted);}
.type-opt.sel-patho.chosen{border-color:var(--patho);color:var(--patho);background:#ff806622;}
.type-opt.sel-normal.chosen{border-color:var(--normal);color:var(--normal);background:#49e0b322;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.modal-sec-title{font-size:12px;color:var(--gold);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}

/* ---------- off-screen export sheet ---------- */
.export-rig{position:fixed;top:0;inset-inline-start:-99999px;pointer-events:none;}
.xsheet{
  background:radial-gradient(ellipse 90% 60% at 15% -10%,#1c3f74,#0e2038 55%),linear-gradient(160deg,#0e2038,#0a1729 70%);
  display:flex;flex-direction:column;
  font-family:'Vazirmatn',system-ui,sans-serif;color:#eef4fc;position:relative;overflow:hidden;
}
.xsheet .x-noise{position:absolute;inset:0;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:26px 26px;pointer-events:none;}
.xsheet .x-topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.xsheet .x-brand{display:flex;align-items:center;gap:14px;}
.xsheet .x-brand img{object-fit:contain;}
.xsheet .x-brand .x-names{display:flex;flex-direction:column;}
.xsheet .x-cat-pill{background:#ffcf4d;color:#1b1400;font-weight:800;border-radius:999px;font-family:'IBM Plex Mono',monospace;}
.xsheet .x-title{font-weight:800;position:relative;z-index:1;}
.xsheet .x-sub{color:#9fb2d4;font-family:'IBM Plex Mono',monospace;position:relative;z-index:1;}
.xsheet .x-img-wrap{position:relative;border-radius:22px;overflow:hidden;background:#000;position:relative;z-index:1;box-shadow:0 30px 60px -20px #000a;}
.xsheet .x-img-wrap img{display:block;width:100%;}
.xsheet .x-marker{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;}
.xsheet .x-marker .ring{position:absolute;inset:0;border-radius:50%;}
.xsheet .x-marker .num{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:800;}
.xsheet .x-sections{display:grid;position:relative;z-index:1;}
.xsheet .x-sec{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;}
.xsheet .x-sec .x-sec-label{color:#ffcf4d;font-family:'IBM Plex Mono',monospace;font-weight:700;text-transform:uppercase;}
.xsheet .x-sec .x-sec-body{color:#dbe6f7;line-height:1.65;}
.xsheet .x-legend{display:flex;flex-direction:column;position:relative;z-index:1;}
.xsheet .x-leg-item{display:flex;align-items:flex-start;}
.xsheet .x-leg-num{flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:800;color:#0e2038;}
.xsheet .x-leg-body{flex:1;}
.xsheet .x-leg-title{color:#ffcf4d;font-weight:700;}
.xsheet .x-leg-desc{color:#c7d4ea;line-height:1.6;}
.xsheet .x-footer{margin-top:auto;position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff22;color:#9fb2d4;font-family:'IBM Plex Mono',monospace;}
</style>

const el = (tag, attrs={}, children=[]) => {
  const n = document.createElement(tag);
  for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "style") n.setAttribute("style", attrs[k]);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  children.forEach(c => c && n.appendChild(c));
  return n;
};
function uid(){ return Math.random().toString(36).slice(2,9); }
function toast(msg){
  const root = document.getElementById("toastRoot");
  root.innerHTML = "";
  const t = el("div",{class:"toast"},[document.createTextNode(msg)]);
  root.appendChild(t);
  setTimeout(()=>{ if(root.contains(t)) root.removeChild(t); }, 2600);
}

const DIFFICULTIES = [{v:"beginner",label:"مقدماتی"},{v:"intermediate",label:"متوسط"},{v:"advanced",label:"پیشرفته"}];
function difficultyLabel(d){ const f=DIFFICULTIES.find(x=>x.v===d); return f? f.label : "مقدماتی"; }
function difficultyColorHex(d){ return {beginner:"#49e0b3",intermediate:"#ffcf4d",advanced:"#ff8066"}[d] || "#49e0b3"; }
function caseNumber(c){ const idx = state.cases.findIndex(x=>x.id===c.id); return String(idx+1).padStart(2,"0"); }

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state.cases = JSON.parse(raw);
    else { state.cases = seedData(); save(); }
  }catch(e){ state.cases = seedData(); }
  if(state.cases.length) state.activeId = state.cases[0].id;
  render();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cases)); }
  catch(e){ toast("ذخیره‌سازی با خطا مواجه شد"); }
}

function activeCase(){ return state.cases.find(c=>c.id===state.activeId) || null; }
function categories(){
  const set = new Set(state.cases.map(c=>c.category).filter(Boolean));
  return Array.from(set);
}

function render(){
  document.getElementById("studentScreen").classList.toggle("hidden", state.screen!=="student");
  document.getElementById("adminScreen").classList.toggle("hidden", state.screen!=="admin");
  if(state.screen==="student") renderStudent(); else renderAdmin();
  renderFullscreen();
}

/* ============ STUDENT RENDER ============ */
function renderStudent(){
  renderChips();
  renderStudentList();
  renderStudentDetail();
}
function renderChips(){
  const row = document.getElementById("chipsRow");
  row.innerHTML="";
  const all = el("button",{class:"chip"+(state.category==="all"?" active":""), onclick:()=>{state.category="all";render();}},[document.createTextNode("همه")]);
  row.appendChild(all);
  categories().forEach(cat=>{
    row.appendChild(el("button",{class:"chip"+(state.category===cat?" active":""), onclick:()=>{state.category=cat;render();}},[document.createTextNode(cat)]));
  });
}
function filteredCases(){
  return state.cases.filter(c=>{
    if(state.category!=="all" && c.category!==state.category) return false;
    if(state.search){
      const q = state.search.trim();
      if(q && !(c.title||"").includes(q) && !(c.category||"").includes(q)) return false;
    }
    return true;
  });
}
function renderStudentList(){
  const list = document.getElementById("studentList");
  list.innerHTML="";
  const cases = filteredCases();
  const searchBox = document.getElementById("searchInput");
  searchBox.value = state.search;
  searchBox.oninput = (e)=>{ state.search = e.target.value; renderStudentList(); };
  document.getElementById("adminEntryBtn").onclick = openAdminGate;

  if(!cases.length){
    list.appendChild(el("div",{class:"hint-banner"},[document.createTextNode("موردی یافت نشد.")]));
    return;
  }
  cases.forEach(c=>{
    const thumb = c.imageUrl
      ? el("div",{class:"thumb", style:`background-image:url('${c.imageUrl.replace(/'/g,"")}')`})
      : el("div",{class:"thumb empty"},[document.createTextNode("بدون تصویر")]);
    const card = el("div",{class:"s-card"+(c.id===state.activeId?" active":""), onclick:()=>{state.activeId=c.id; state.activeFinding=null; state.fsView=null; render();}},[
      thumb,
      el("div",{class:"meta"},[
        el("div",{class:"cat"},[document.createTextNode("کیس "+caseNumber(c)+(c.category?" · "+c.category:""))]),
        el("div",{class:"ttl"},[document.createTextNode(c.title||"بدون عنوان")]),
        el("div",{class:"badge-row"},[
          el("span",{class:"diff-badge", style:`--d-color:${difficultyColorHex(c.difficulty)}; --d-bg:${difficultyColorHex(c.difficulty)}22;`},[document.createTextNode(difficultyLabel(c.difficulty))])
        ])
      ])
    ]);
    list.appendChild(card);
  });
}
function renderStudentDetail(){
  const box = document.getElementById("studentDetail");
  box.innerHTML="";
  const c = activeCase();
  if(!c){
    box.appendChild(el("div",{class:"s-empty"},[
      el("div",{},[document.createTextNode("موردی برای نمایش انتخاب نشده است.")])
    ]));
    return;
  }
  const detail = el("div",{class:"s-detail"});

  detail.appendChild(el("div",{class:"s-detail-top"},[
    el("div",{class:"s-detail-title"},[
      el("h2",{},[document.createTextNode(c.title)]),
      c.subtitle ? el("div",{class:"sub"},[document.createTextNode(c.subtitle)]) : null,
      el("div",{class:"badge-row"},[
        el("span",{class:"cat-badge"},[document.createTextNode("کیس "+caseNumber(c)+(c.category?" · "+c.category:""))]),
        el("span",{class:"diff-badge", style:`--d-color:${difficultyColorHex(c.difficulty)}; --d-bg:${difficultyColorHex(c.difficulty)}22;`},[document.createTextNode(difficultyLabel(c.difficulty))])
      ])
    ])
  ]));

  const secs = c.sections||{};
  const secGrid = el("div",{class:"sections-grid"});
  [["تعریف",secs.definition],["علل",secs.causes],["علائم",secs.symptoms],["اهمیت تصویربرداری",secs.imaging]].forEach(([label,body])=>{
    secGrid.appendChild(el("div",{class:"sec-card"},[
      el("div",{class:"sec-label"},[document.createTextNode(label)]),
      el("div",{class:"sec-body"+(body?"":" empty")},[document.createTextNode(body||"ثبت نشده")])
    ]));
  });
  detail.appendChild(secGrid);

  detail.appendChild(buildStage(c));

  const otherItems = (c.otherFindings||"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(otherItems.length){
    const box = el("div",{class:"other-findings"});
    box.appendChild(el("div",{class:"of-title"},[document.createTextNode("سایر یافته‌های قابل مشاهده در تصویر")]));
    box.appendChild(el("div",{class:"of-note"},[document.createTextNode("این موارد خارج از موضوع اصلی این کیس هستند و فقط اشاره شده‌اند.")]));
    const list = el("div",{class:"of-list"});
    otherItems.forEach(t=> list.appendChild(el("span",{class:"of-chip"},[document.createTextNode(t)])));
    box.appendChild(list);
    detail.appendChild(box);
  }

  if(c.source){
    detail.appendChild(el("div",{class:"source-line"},[document.createTextNode("منبع علمی: "), el("b",{},[document.createTextNode(c.source)])]));
  }

  box.appendChild(detail);
}
function buildImgPanel(label, srcUrl, viewKey, showMarkers, c, emptyText){
  const panel = el("div",{class:"img-panel"});
  panel.appendChild(el("div",{class:"panel-head"},[
    el("span",{class:"panel-label"+(viewKey==="normal"?" is-normal":"")},[el("span",{class:"dot"}), document.createTextNode(label)]),
    srcUrl ? el("button",{class:"fs-btn", onclick:()=>{state.fsView=viewKey; render();}},[document.createTextNode("⤢")]) : null
  ]));
  const canvas = el("div",{class:"img-canvas"});
  let imgWrap;
  if(srcUrl){
    imgWrap = el("div",{class:"img-wrap"});
    const img = el("img",{src:srcUrl, alt:label});
    imgWrap.appendChild(img);
    if(showMarkers){
      c.findings.forEach((f,idx)=> imgWrap.appendChild(buildStudentMarker(c,f,idx)));
    }
  } else {
    imgWrap = el("div",{class:"img-wrap empty"},[document.createTextNode(emptyText)]);
  }
  canvas.appendChild(imgWrap);
  panel.appendChild(canvas);
  return panel;
}
function buildStage(c){
  const stage = el("div",{class:"img-stage"});
  const hasCompare = !!c.compareImageUrl;
  const row = el("div",{class:"stage-row"+(hasCompare?"":" single")});
  row.appendChild(buildImgPanel("تصویر بیمار", c.imageUrl, "patient", true, c, "تصویری ثبت نشده است"));
  if(hasCompare){
    row.appendChild(buildImgPanel("تصویر طبیعی (مقایسه)", c.compareImageUrl, "normal", false, c, ""));
  }
  stage.appendChild(row);

  const activeF = c.findings.find(f=>f.id===state.activeFinding);
  if(activeF){
    stage.appendChild(el("div",{
      class:"dock-desc",
      style:`--m-color:${typeColorHex(activeF.type)}; --m-bg:${typeColorHex(activeF.type)}22;`
    },[
      el("div",{class:"dd-top"},[
        el("span",{class:"dd-title"},[document.createTextNode(activeF.title||"—")]),
        el("span",{class:"dd-type"},[document.createTextNode(typeLabel(activeF.type))]),
        el("button",{class:"dd-close", onclick:()=>{state.activeFinding=null; render();}},[document.createTextNode("✕")])
      ]),
      el("div",{class:"dd-desc"},[document.createTextNode(activeF.desc||"")])
    ]));
  } else {
    stage.appendChild(el("div",{class:"img-hint"},[document.createTextNode(
      hasCompare ? "برای مشاهده توضیح علمی هر یافته روی نقاط طلایی تصویر بیمار ضربه بزنید — تصویر طبیعی کنارش برای مقایسه مستقیم قرار دارد. با ⤢ هر تصویر را بزرگ کنید."
                 : "برای مشاهده توضیح علمی هر یافته، روی نقاط طلایی روی تصویر ضربه بزنید."
    )]));
  }
  return stage;
}
function renderFullscreen(){
  let overlay = document.getElementById("fsOverlay");
  if(!state.fsView || state.screen!=="student"){ if(overlay) overlay.remove(); return; }
  const c = activeCase();
  if(!c){ state.fsView=null; return; }
  const isPatient = state.fsView==="patient";
  const srcUrl = isPatient ? c.imageUrl : c.compareImageUrl;
  if(!srcUrl){ state.fsView=null; return; }
  if(!overlay){
    overlay = el("div",{id:"fsOverlay", class:"fs-overlay"});
    document.body.appendChild(overlay);
  }
  overlay.innerHTML="";
  overlay.appendChild(el("div",{class:"fs-top"},[
    el("div",{style:"font-size:13.5px;font-weight:700;"},[document.createTextNode(c.title+" — "+(isPatient?"تصویر بیمار":"تصویر طبیعی"))]),
    el("button",{class:"fs-close", onclick:()=>{state.fsView=null; render();}},[document.createTextNode("بستن ✕")])
  ]));
  const canvas = el("div",{class:"img-canvas"});
  const imgWrap = el("div",{class:"img-wrap"});
  const img = el("img",{src:srcUrl, alt:c.title});
  imgWrap.appendChild(img);
  if(isPatient){
    c.findings.forEach((f,idx)=> imgWrap.appendChild(buildStudentMarker(c,f,idx)));
  }
  canvas.appendChild(imgWrap);
  overlay.appendChild(canvas);
  if(isPatient){
    const activeF = c.findings.find(f=>f.id===state.activeFinding);
    if(activeF){
      overlay.appendChild(el("div",{
        class:"dock-desc",
        style:`--m-color:${typeColorHex(activeF.type)}; --m-bg:${typeColorHex(activeF.type)}22;`
      },[
        el("div",{class:"dd-top"},[
          el("span",{class:"dd-title"},[document.createTextNode(activeF.title||"—")]),
          el("span",{class:"dd-type"},[document.createTextNode(typeLabel(activeF.type))]),
          el("button",{class:"dd-close", onclick:()=>{state.activeFinding=null; render();}},[document.createTextNode("✕")])
        ]),
        el("div",{class:"dd-desc"},[document.createTextNode(activeF.desc||"")])
      ]));
    }
  }
}
function buildStudentMarker(c,f,idx){
  const isActive = state.activeFinding===f.id;
  return el("div",{
    class:"marker"+(isActive?" active":""),
    style:`left:${f.x}%; top:${f.y}%; --m-color:${typeColorHex(f.type)};`,
    onclick:(e)=>{ e.stopPropagation(); state.activeFinding = isActive?null:f.id; render(); }
  },[el("div",{class:"ring"}), el("div",{class:"core"})]);
}

function renderAdminBody(){
  const body = document.getElementById("stageBody");
  body.innerHTML="";
  const c = activeCase();
  if(!c){
    body.appendChild(el("div",{class:"empty-state"},[
      el("div",{class:"glyph"},[document.createTextNode("＋")]),
      el("div",{},[document.createTextNode("برای شروع یک «مورد جدید» بسازید — مثلاً پنومونی، پنوموتوراکس یا شکستگی.")])
    ]));

  }
  if(!c.findings.length) panel.appendChild(el("div",{class:"hint-banner"},[document.createTextNode("هنوز یافته‌ای ثبت نشده.")]));

    },[
      el("div",{class:"fc-top"},[
        el("span",{class:"num"},[document.createTextNode(String(idx+1).padStart(2,"0"))]),
        el("span",{class:"ftitle"},[document.createTextNode(f.title||"بدون عنوان")])
      ]),
      el("div",{class:"type-tag"},[document.createTextNode(typeLabel(f.type))]),
      el("div",{class:"fdesc"+(isActive?"":" collapsed")},[document.createTextNode(f.desc||"")])
    ]);
    if(state.admMode==="edit"){
      const rowActions = el("div",{style:"display:flex;gap:6px;margin-top:8px;"});
      rowActions.appendChild(el("button",{class:"btn small", onclick:(e)=>{e.stopPropagation(); openFindingModal(c,f);}},[document.createTextNode("ویرایش")]));
      rowActions.appendChild(el("button",{class:"btn small danger", onclick:(e)=>{e.stopPropagation(); deleteFinding(c,f);}},[document.createTextNode("حذف")]));

    panel.appendChild(card);

  workspace.appendChild(panel);

function buildAdminMarker(c,f,idx){

}

/* ---------- modals ---------- */
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

function openCaseModal(existing){
  const root = document.getElementById("modalRoot");
  const s = existing? (existing.sections||{}) : {};
  const titleInput = el("input",{value: existing?existing.title:"", placeholder:"مثلاً: پنومونی لوبار"});
  const catInput = el("select",{});
  CATEGORIES.forEach(cat=> catInput.appendChild(el("option",{value:cat},[document.createTextNode(cat)])));
  catInput.value = existing?(existing.category||CATEGORIES[0]):CATEGORIES[0];
  const diffInput = el("select",{});

    el("div",{class:"field"},[el("label",{},[document.createTextNode("تعریف")]), defInput]),
    el("div",{class:"field"},[el("label",{},[document.createTextNode("علل")]), causeInput]),

/* ---------- export sheets (Instagram post / story) ---------- */
async function toDataURL(url){
  if(!url) return null;
  if(url.startsWith("data:")) return url;
  try{
    const res = await fetch(url, {mode:"cors"});
    if(!res.ok) throw new Error("bad status");
    const blob = await res.blob();
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}
async function downloadSheet(c, variant){
  if(typeof html2canvas === "undefined"){ toast("ابزار خروجی تصویر بارگذاری نشد؛ اتصال اینترنت را بررسی کنید"); return; }
  if(!c.imageUrl){ toast("ابتدا یک تصویر برای این مورد ثبت کنید"); return; }
  toast("در حال ساخت خروجی حرفه‌ای...");

  const W = variant==="story" ? 1080 : 1080;
  const H = variant==="story" ? 1920 : 1350;
  const pad = 64;

  const rig = el("div",{class:"export-rig"});
  const sheet = el("div",{class:"xsheet", style:`width:${W}px;height:${H}px;padding:${pad}px;`});
  sheet.appendChild(el("div",{class:"x-noise"}));

  const logoSize = 64;
  sheet.appendChild(el("div",{class:"x-topbar", style:"margin-bottom:34px;"},[
    el("div",{class:"x-brand"},[
      el("img",{src:LOGO, style:`width:${logoSize}px;height:${logoSize}px;`}),
      el("div",{class:"x-names"},[
        el("div",{style:"font-size:20px;font-weight:800;"},[document.createTextNode("انجمن علمی رادیولوژی سبزوار")]),
        el("div",{style:"font-size:13px;color:#9fb2d4;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;"},[document.createTextNode("RADIATION SCIENCES ASSOCIATION")])
      ])
    ]),
    el("div",{class:"x-cat-pill", style:"padding:8px 18px;font-size:16px;"},[document.createTextNode("کیس "+caseNumber(c)+(c.category?" · "+c.category:""))])
  ]));

  sheet.appendChild(el("div",{class:"x-title", style:"font-size:46px;margin-bottom:6px;"},[document.createTextNode(c.title)]));
  if(c.subtitle) sheet.appendChild(el("div",{class:"x-sub", style:"font-size:19px;margin-bottom:26px;"},[document.createTextNode(c.subtitle)]));
  else sheet.appendChild(el("div",{style:"height:20px;"}));

  const hasFindings = c.findings && c.findings.length>0;
  const imgH = variant==="story" ? (hasFindings?440:560) : (hasFindings?340:480);
  const imgWrap = el("div",{class:"x-img-wrap", style:`height:${imgH}px;margin-bottom:22px;`});
  const safeImgSrc = await toDataURL(c.imageUrl);
  if(!safeImgSrc){
    toast("بارگذاری تصویر برای خروجی ناموفق بود — اتصال اینترنت یا لینک تصویر را بررسی کنید");
    return;
  }
  const img = el("img",{src:safeImgSrc, style:`height:${imgH}px;width:100%;object-fit:cover;`});
  imgWrap.appendChild(img);
  await new Promise((resolve)=>{ if(img.complete && img.naturalWidth){resolve();} else {img.onload=resolve; img.onerror=resolve;} });

  c.findings.forEach((f,idx)=>{
    const color = typeColorHex(f.type);
    imgWrap.appendChild(el("div",{class:"x-marker", style:`left:${f.x}%; top:${f.y}%; width:40px; height:40px;`},[
      el("div",{class:"ring", style:`border:3px solid ${color};`}),
      el("div",{class:"num", style:`width:40px;height:40px;background:${color};color:#0e2038;font-size:17px;`},[document.createTextNode(String(idx+1))])
    ]));
  });
  sheet.appendChild(imgWrap);

  if(hasFindings){
    const maxItems = variant==="story" ? 5 : 3;
    const descLen = variant==="story" ? 130 : 78;
    const legend = el("div",{class:"x-legend", style:"gap:10px;margin-bottom:20px;"});
    c.findings.slice(0,maxItems).forEach((f,idx)=>{
      const color = typeColorHex(f.type);
      legend.appendChild(el("div",{class:"x-leg-item", style:"gap:12px;"},[
        el("div",{class:"x-leg-num", style:`width:30px;height:30px;font-size:14px;background:${color};`},[document.createTextNode(String(idx+1))]),
        el("div",{class:"x-leg-body"},[
          el("div",{class:"x-leg-title", style:"font-size:15px;margin-bottom:2px;"},[document.createTextNode(f.title||"—")]),
          el("div",{class:"x-leg-desc", style:"font-size:13.5px;"},[document.createTextNode((f.desc||"").slice(0,descLen))])
        ])
      ]));
    });
    if(c.findings.length>maxItems){
      legend.appendChild(el("div",{style:"font-size:12.5px;color:#8fa3c7;padding-inline-start:42px;"},[document.createTextNode(`+ ${c.findings.length-maxItems} یافته دیگر در نسخه آنلاین`)]));
    }
    sheet.appendChild(legend);
  }

  const secs = c.sections||{};
  const secList = [["تعریف",secs.definition],["علل",secs.causes],["علائم",secs.symptoms],["اهمیت تصویربرداری",secs.imaging]].filter(([,b])=>b);
  if(secList.length && !hasFindings){
    const cols = variant==="story" ? 1 : 2;
    const secGrid = el("div",{class:"x-sections", style:`grid-template-columns:repeat(${cols},1fr);gap:14px;margin-bottom:22px;`});
    const maxLen = variant==="story" ? 150 : 100;
    secList.forEach(([label,body])=>{
      secGrid.appendChild(el("div",{class:"x-sec", style:"padding:16px 18px;"},[
        el("div",{class:"x-sec-label", style:"font-size:14px;margin-bottom:6px;"},[document.createTextNode(label)]),
        el("div",{class:"x-sec-body", style:"font-size:16px;"},[document.createTextNode((body||"").slice(0,maxLen))])
      ]));
    });
    sheet.appendChild(secGrid);
  }

  sheet.appendChild(el("div",{class:"x-footer", style:"padding-top:18px;font-size:15px;"},[
    el("span",{},[document.createTextNode("دانشگاه علوم پزشکی سبزوار")]),
    el("span",{},[document.createTextNode(c.source ? ("منبع: "+c.source.slice(0,40)) : "اطلس آموزشی رادیولوژی")])
  ]));

  rig.appendChild(sheet);
  document.body.appendChild(rig);

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(sheet, {backgroundColor:"#0e2038", scale:1.6, useCORS:true, width:W, height:H});
    const link = document.createElement("a");
    link.download = (c.title||"case").replace(/\s+/g,"-") + "-" + variant + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    toast("خروجی آماده شد ✓");
  }catch(err){
    toast("ساخت خروجی ناموفق بود — لینک تصویر باید مجوز CORS داشته باشد");
  }finally{
    document.body.removeChild(rig);
  }
}

load();
})();
